name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test the patcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is what players run; its NTFS hard links are what the version folders rely on.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build patcher/Orthomania.Patcher.sln -c Release
      - run: dotnet test patcher/Orthomania.Patcher.sln -c Release --no-build --logger "console;verbosity=normal"

  publish:
    name: Publish the patcher (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish patcher/src/Orthomania.Patcher -c Release -r win-x64 --self-contained -o artifacts/patcher
      - uses: actions/upload-artifact@v4
        with:
          name: orthomania-patcher-win-x64
          path: artifacts/patcher
