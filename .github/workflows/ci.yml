name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test the patcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is what players run; its NTFS hard links are what the version folders rely on.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build patcher/Orthomania.Patcher.sln -c Release
      - run: dotnet test patcher/Orthomania.Patcher.sln -c Release --no-build --logger "console;verbosity=normal"

  test-ruleset:
    name: Test the game side (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Against the lazer release in patcher/ruleset/lazer-version.txt, from NuGet. Published builds are tested against each
      # lazer release's own files instead (lazer-builds.yml).
      - run: dotnet test patcher/ruleset/osu.Game.Rulesets.ManiaOrtho.Tests -c Release --logger "console;verbosity=normal"
      - name: The release steps run
        shell: bash
        run: python3 -I patcher/ruleset/release.py --help

  test-server:
    name: Test the score server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build server/OrthoServer.sln -c Release
      - run: dotnet test server/OrthoServer.sln -c Release --no-build --logger "console;verbosity=normal"

  launch:
    name: launch.bat builds the patcher and the server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run launch.bat without opening the window
        shell: cmd
        env:
          ORTHOMANIA_BUILD_ONLY: "1"
        run: call launch.bat
      - name: Both are where the patcher looks for them, and orthomania.exe is one file
        shell: cmd
        run: |
          if not exist artifacts\launch\orthomania.exe exit /b 1
          if not exist artifacts\launch\server\OrthoServer.exe exit /b 1
          if exist artifacts\launch\*.dll exit /b 1

  publish:
    name: Publish the patcher (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Published for win-x64, the patcher is one self-contained file (Orthomania.Patcher.csproj): the file a release carries.
      - run: dotnet publish patcher/src/Orthomania.Patcher -c Release -r win-x64 -o artifacts/patcher
      - name: orthomania.exe is the only file, and starts and draws its window on its own
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/patcher)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'orthomania.exe') { throw "expected only orthomania.exe, found: $($files.Name -join ', ')" }
          "orthomania.exe: {0:N1} MB" -f ($files[0].Length / 1MB)
          $shot = Join-Path $env:RUNNER_TEMP 'orthomania-ready.png'
          $game = Start-Process artifacts/patcher/orthomania.exe -ArgumentList '--demo', 'ready', '--screenshot', $shot -PassThru
          if (-not $game.WaitForExit(180000)) { $game.Kill(); throw 'orthomania.exe did not close after its screenshot' }
          if (-not (Test-Path $shot)) { throw "orthomania.exe exited ($($game.ExitCode)) without drawing its window" }
      - uses: actions/upload-artifact@v4
        with:
          name: orthomania-patcher-win-x64
          path: artifacts/patcher
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orthomania-patcher-screenshot
          path: ${{ runner.temp }}/orthomania-ready.png
          if-no-files-found: ignore

  publish-server:
    name: Publish the score server (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish server/OrthoServer -c Release -r win-x64 --self-contained -o artifacts/server
      - uses: actions/upload-artifact@v4
        with:
          name: orthomania-server-win-x64
          path: artifacts/server
